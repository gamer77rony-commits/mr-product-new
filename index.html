<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MR PRODUCT - Premium fashion, watches and lifestyle products.">
  <title>MR PRODUCT | Premium Store</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;background:#faf8f2;color:#171717}
    header{background:#111;color:#d6b46a;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
    .logo{font-size:24px;font-weight:bold;letter-spacing:2px}
    .logo span{color:white}
    nav a{color:#fff;text-decoration:none;margin-left:18px;font-size:14px}
    .hero{background:linear-gradient(120deg,#111,#353024);color:#fff;text-align:center;padding:85px 20px}
    .hero h1{font-size:42px;color:#e3c47d;margin-bottom:15px}
    .hero p{margin-bottom:25px;color:#eee}
    .btn{display:inline-block;background:#c6a45d;color:#111;padding:13px 25px;text-decoration:none;border:0;font-weight:bold;cursor:pointer}
    .section{padding:45px 5%}
    .section h2{text-align:center;margin-bottom:25px;font-size:28px}
    .products{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px}
    .card{background:white;padding:15px;border:1px solid #e8e1d4;text-align:center}
    .card img{width:100%;height:210px;object-fit:cover;background:#eee}
    .card h3{margin:12px 0}
    .price{color:#98712e;font-weight:bold;margin:10px}
    .cart{background:#111;color:white;padding:35px 5%;text-align:center}
    footer{background:#111;color:#ccc;text-align:center;padding:25px}
    @media(max-width:600px){.hero h1{font-size:30px}nav{margin-top:15px}nav a{margin:0 8px}}
  </style>
</head>
<body>

<header>
  <div class="logo">MR <span>PRODUCT</span></div>
  <nav>
    <a href="#home">Home</a>
    <a href="#products">Products</a>
    <a href="#cart">Cart (<span id="cartCount">0</span>)</a>
  </nav>
</header>

<section class="hero" id="home">
  <h1>Discover Your Style</h1>
  <p>Premium Products. Elegant Lifestyle. Exceptional Quality.</p>
  <a href="#products" class="btn">SHOP NOW</a>
</section>

<section class="section" id="products">
  <h2>Our Products</h2>
  <div class="products" id="productList"></div>
</section>

<section class="cart" id="cart">
  <h2>Your Shopping Cart</h2>
  <p id="cartItems">Your cart is empty.</p>
  <h3 id="cartTotal">Total: ৳0</h3>
</section>

<footer>
  <p>© 2026 MR PRODUCT. All Rights Reserved.</p>
</footer>

<script>
const products=[
  {id:1,name:"Luxury Watch",price:2500,image:"https://placehold.co/400x300/222/c9a65b?text=Luxury+Watch"},
  {id:2,name:"Premium Dress",price:1800,image:"https://placehold.co/400x300/222/c9a65b?text=Premium+Dress"},
  {id:3,name:"Beauty Collection",price:950,image:"https://placehold.co/400x300/222/c9a65b?text=Beauty+Collection"}
];

let cart=[];

function showProducts(){
  document.getElementById("productList").innerHTML=products.map(p=>`
    <div class="card">
      <img src="${p.image}" alt="${p.name}">
      <h3>${p.name}</h3>
      <p class="price">৳${p.price}</p>
      <button class="btn" onclick="addToCart(${p.id})">ADD TO CART</button>
    </div>
  `).join("");
}

function addToCart(id){
  const product=products.find(p=>p.id===id);
  const item=cart.find(p=>p.id===id);
  if(item)item.quantity++;
  else cart.push({...product,quantity:1});
  showCart();
}

function showCart(){
  document.getElementById("cartCount").textContent=
    cart.reduce((sum,p)=>sum+p.quantity,0);

  document.getElementById("cartItems").innerHTML=
    cart.length ? cart.map(p=>
      `<p>${p.name} × ${p.quantity} — ৳${p.price*p.quantity}</p>`
    ).join("") : "Your cart is empty.";

  document.getElementById("cartTotal").textContent=
    "Total: ৳"+cart.reduce((sum,p)=>sum+p.price*p.quantity,0);
}

showProducts();
showCart();
</script>

</body>
</html>
